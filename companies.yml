# ── Banks and fintech you follow ──────────────────────────────────────
# "ignore" skips headlines where the bank is only the commentator (e.g. "JPMorgan analysts see Nvidia…").
- name: JPMorgan
  ticker: JPM
  market: US
  tier: 1
  sector: Banking & payments
  aliases: [JPMorgan, JP Morgan, J.P. Morgan, JPMorgan Chase, Jamie Dimon, JPM, 摩根大通]
  search: '"JPMorgan" (stock OR shares OR earnings OR Dimon)'
  ignore:
    - 'J\.?\s?P\.?\s?Morgan(?: Chase)?(?:''s|’s)?(?: \w+)? (?:analysts?|strategists?|economists?|sees|expects|predicts|forecasts|upgrades?|downgrades?|initiates|reiterates|is (?:bullish|bearish))\b'
    - '(?:according to|from|by|per) J\.?\s?P\.?\s?Morgan\b'
    - '(?:摩根大通|小摩)(?:[：:]|指|料|预计|預計|认为|認為|看好|上调|上調|下调|下調|评级|評級|目标价|目標價)'
- { name: MoneyLion, market: US, tier: 2, sector: Fintech app (owned by Gen Digital since 2025),
    aliases: [MoneyLion], search: '"MoneyLion"' }
- { name: Gen Digital, ticker: GEN, market: US, tier: 2, sector: Cyber safety (owns MoneyLion),
    aliases: [Gen Digital] }


# Companies the bot recognises in headlines: AI, chips, fintech and big tech, worldwide.
#
#   tier 1  = giants whose news can move the whole market
#   tier 2  = other important names
#   market  = where it is listed (US, CN, HK, TW, JP, KR, SG, MY, EU)
#   private = not listed yet, so it's an IPO candidate
#   lang    = which language you prefer for its news: en, zh or both
#             (default: zh for CN/HK, both for TW/MY, en for everything else)
#   search  = optional: exactly what to search for when the company is on your watchlist
#   ignore  = optional: headline patterns where the name isn't the subject
#
# Aliases are matched as whole words (English, case-insensitive; ALL-CAPS tickers
# and names starting with a lowercase letter must match exactly) or as plain text (Chinese).
# To add a company, copy a block and edit it.


name: Update news

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification to check your phone/email setup"
        type: boolean
        default: false
  push:
    paths:
      - "config.yml"
      - "companies.yml"
      - "newsbot/**"
      - "site/**"
      - "requirements.txt"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write   # save news history to the news-data branch

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    # Pushes to other branches (e.g. work in progress) don't publish anything.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Load previous news
        run: |
          mkdir -p state
          if git fetch --depth=1 origin news-data; then
            git archive FETCH_HEAD data | tar -x -C state
          else
            echo "No news-data branch yet: this is the first run."
          fi

      - name: Fetch news, score it and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL_OVERRIDE: ${{ vars.DASHBOARD_URL }}
          TEST_FLAG: ${{ inputs.test_notification && '--test-notification' || '' }}
        run: |
          export DASHBOARD_URL="${DASHBOARD_URL_OVERRIDE:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/}"
          python -m newsbot --data-dir state/data $TEST_FLAG

      - name: Save news history (news-data branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd state
          git init -q -b news-data
          git add data
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "News data $(date -u +%Y-%m-%dT%H:%MZ)"
          # Force-push a single commit so the branch never grows.
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news-data

      - name: Build website
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp state/data/news.json _site/data/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that GitHub Pages is turned on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The dashboard isn't published yet. Turn on GitHub Pages: Settings → Pages → Source: GitHub Actions."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
